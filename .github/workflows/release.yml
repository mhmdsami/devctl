name: Release Raycast Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.6). Not committed - the tag records it."
        required: true
      notes:
        description: "Release notes (become the changelog)"
        required: false
        default: "Bug fixes and improvements"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set and check version
        run: |
          VERSION="${{ inputs.version }}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::$VERSION is not a semver version"; exit 1; }
          if git ls-remote --exit-code --tags origin "v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const file = "raycast/package.json";
            const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
          '
          echo "publishing v$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: raycast/github-actions/setup-cli@v1.18.0
        with:
          version: 1.104.6
      - uses: raycast/github-actions/ray-cli@v1.18.0
        with:
          paths: raycast
          command: publish
          access_token: ${{ secrets.RAYCAST_ORGANIZATION_TOKEN }}
      - name: Tag
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v$VERSION" --title "v$VERSION" --notes "${{ inputs.notes }}" --verify-tag
